name: newsxpresslive
description: NewsXpressLive – Breaking News, Latest Updates

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # Networking
  http: ^1.2.1

  # State management
  provider: ^6.1.2

  # Images
  cached_network_image: ^3.3.1

  # Local storage (bookmarks, preferences)
  shared_preferences: ^2.3.2

  # Render HTML article body
  flutter_html: ^3.0.0-beta.2

  # Relative timestamps ("2 hours ago")
  timeago: ^3.6.1

  # Open external URLs
  url_launcher: ^6.3.0

  # Share articles
  share_plus: ^9.0.0

  # Google Fonts
  google_fonts: ^6.2.1

  # Shimmer skeleton loading
  shimmer: ^3.0.0

  # Icons
  cupertino_icons: ^1.0.8

  # ── Firebase ──────────────────────────────────────────────────────────
  firebase_core: ^3.8.1
  firebase_auth: ^5.4.1
  google_sign_in: ^6.2.2
  firebase_messaging: ^15.2.4
  firebase_analytics: ^11.3.6

  # ── Monetization ──────────────────────────────────────────────────────
  google_mobile_ads: ^5.2.0

  # ── Media ─────────────────────────────────────────────────────────────
  image_picker: ^1.1.2

  # ── Offline cache ─────────────────────────────────────────────────────
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # ── Notifications (foreground) ────────────────────────────────────────
  flutter_local_notifications: ^18.0.1

  # ── Deep linking ──────────────────────────────────────────────────────
  app_links: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # Uncomment when font files are added:
  # fonts:
  #   - family: NotoSansDevanagari
  #     fonts:
  #       - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
